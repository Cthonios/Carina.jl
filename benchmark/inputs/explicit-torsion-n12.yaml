# explicit-torsion-n12 -- generated by benchmark/explicit_sweep.jl.  Do not edit by hand.
# 12x12x240 hex torsion bar, central difference, 3000 steps.
type: single
input mesh file: ../meshes/torsion12.g
output mesh file: explicit-torsion-n12.e
output interval: 0.0012499999999999998
output:
  stress: false
  deformation gradient: false
  recovery: none
model:
  type: solid mechanics
  material:
    blocks:
      torsion: neohookean
    neohookean:
      elastic modulus: 1.0e9
      density: 1000.0
      Poisson's ratio: 0.25
time integrator:
  type: central difference
  time step: 8.333333333333332e-7
  initial time: 0.0
  final time: 0.0024999999999999996
initial conditions:
  velocity:
    - node set: nsall
      function: "a=8000; -a*y*z"
      component: x
    - node set: nsall
      function: "a=8000; a*x*z"
      component: y
    - node set: nsall
      function: "0.0"
      component: z
