# explicit-torsion-n50 -- generated by benchmark/explicit_sweep.jl.  Do not edit by hand.
# 50x50x1000 hex torsion bar, central difference, 80 steps.
type: single
input mesh file: ../meshes/torsion50.g
output mesh file: explicit-torsion-n50.e
output interval: 8.0e-6
output:
  stress: false
  deformation gradient: false
  recovery: none
model:
  type: solid mechanics
  material:
    blocks:
      torsion: neohookean
    neohookean:
      elastic modulus: 1.0e9
      density: 1000.0
      Poisson's ratio: 0.25
time integrator:
  type: central difference
  time step: 2.0e-7
  initial time: 0.0
  final time: 1.6e-5
initial conditions:
  velocity:
    - node set: nsall
      function: "a=8000; -a*y*z"
      component: x
    - node set: nsall
      function: "a=8000; a*x*z"
      component: y
    - node set: nsall
      function: "0.0"
      component: z
