# torsion-newmark-gpu-lbfgs — generated by benchmark/write_inputs.jl from benchmark/cases.jl.
# Regenerate after editing cases.jl; do not edit this file by hand.
type: single
device: rocm
input mesh file: ../../examples/meshes/torsion/torsion.g
output mesh file: torsion-newmark-gpu-lbfgs.e
model:
  type: solid mechanics
  material:
    blocks:
      torsion: neohookean
    neohookean:
      elastic modulus: 1.0e9
      density: 1000.0
      Poisson's ratio: 0.25
time integrator:
  type: newmark
  time step: 5.0e-5
  gamma: 0.5
  final time: 2.0e-4
  initial time: 0.0
  beta: 0.25
initial conditions:
  velocity:
    - node set: nsall
      function: "a=8000; -a*y*z"
      component: x
    - node set: nsall
      function: "a=8000; a*x*z"
      component: y
    - node set: nsall
      function: "0.0"
      component: z
solver:
  type: newton
  termination:
    fail when any:
      - maximum iterations: 500
    converge when any:
      - absolute residual: 1.0e-6
      - relative residual: 1.0e-10
  linear solver:
    type: lbfgs
    history size: 10
