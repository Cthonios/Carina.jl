# explicit-torsion-n36 -- generated by benchmark/explicit_sweep.jl.  Do not edit by hand.
# 36x36x720 hex torsion bar, central difference, 160 steps.
type: single
input mesh file: ../meshes/torsion36.g
output mesh file: explicit-torsion-n36.e
output interval: 2.222222222222222e-5
output:
  stress: false
  deformation gradient: false
  recovery: none
model:
  type: solid mechanics
  material:
    blocks:
      torsion: neohookean
    neohookean:
      elastic modulus: 1.0e9
      density: 1000.0
      Poisson's ratio: 0.25
time integrator:
  type: central difference
  time step: 2.7777777777777776e-7
  initial time: 0.0
  final time: 4.444444444444444e-5
initial conditions:
  velocity:
    - node set: nsall
      function: "a=8000; -a*y*z"
      component: x
    - node set: nsall
      function: "a=8000; a*x*z"
      component: y
    - node set: nsall
      function: "0.0"
      component: z
