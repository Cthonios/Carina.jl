# torsion-qs-gpu-cg-amg — generated by benchmark/write_inputs.jl from benchmark/cases.jl.
# Regenerate after editing cases.jl; do not edit this file by hand.
type: single
device: rocm
input mesh file: ../../examples/meshes/torsion/torsion.g
output mesh file: torsion-qs-gpu-cg-amg.e
model:
  type: solid mechanics
  material:
    blocks:
      torsion: neohookean
    neohookean:
      elastic modulus: 1.0e9
      density: 1000.0
      Poisson's ratio: 0.25
time integrator:
  type: quasi static
  initial time: 0.0
  final time: 1.0
  time step: 0.25
boundary conditions:
  dirichlet:
    - node set: "-Z"
      component: x
      function: "0.0"
    - node set: "-Z"
      component: y
      function: "0.0"
    - node set: "-Z"
      component: z
      function: "0.0"
    - node set: "+Z"
      component: x
      function: "th=0.05; x*(cos(th*t)-1.0) - y*sin(th*t)"
    - node set: "+Z"
      component: y
      function: "th=0.05; x*sin(th*t) + y*(cos(th*t)-1.0)"
    - node set: "+Z"
      component: z
      function: "0.0"
solver:
  type: newton
  termination:
    fail when any:
      - maximum iterations: 30
    converge when any:
      - absolute residual: 1.0e-6
      - relative residual: 1.0e-10
  linear solver:
    type: iterative
    tolerance: 1.0e-8
    maximum iterations: 1000
    preconditioner:
      type: amg
