# explicit-torsion-n8 -- generated by benchmark/explicit_sweep.jl.  Do not edit by hand.
# 8x8x160 hex torsion bar, central difference, 8000 steps.
type: single
input mesh file: ../meshes/torsion8.g
output mesh file: explicit-torsion-n8.e
output interval: 0.004999999999999999
output:
  stress: false
  deformation gradient: false
  recovery: none
model:
  type: solid mechanics
  material:
    blocks:
      torsion: neohookean
    neohookean:
      elastic modulus: 1.0e9
      density: 1000.0
      Poisson's ratio: 0.25
time integrator:
  type: central difference
  time step: 1.2499999999999999e-6
  initial time: 0.0
  final time: 0.009999999999999998
initial conditions:
  velocity:
    - node set: nsall
      function: "a=8000; -a*y*z"
      component: x
    - node set: nsall
      function: "a=8000; a*x*z"
      component: y
    - node set: nsall
      function: "0.0"
      component: z
