# explicit-torsion-n20 -- generated by benchmark/explicit_sweep.jl.  Do not edit by hand.
# 20x20x400 hex torsion bar, central difference, 100 steps.
type: single
input mesh file: ../meshes/torsion20.g
output mesh file: explicit-torsion-n20.e
output interval: 2.4999999999999998e-5
output:
  stress: false
  deformation gradient: false
  recovery: none
model:
  type: solid mechanics
  material:
    blocks:
      torsion: neohookean
    neohookean:
      elastic modulus: 1.0e9
      density: 1000.0
      Poisson's ratio: 0.25
time integrator:
  type: central difference
  time step: 5.0e-7
  initial time: 0.0
  final time: 4.9999999999999996e-5
initial conditions:
  velocity:
    - node set: nsall
      function: "a=8000; -a*y*z"
      component: x
    - node set: nsall
      function: "a=8000; a*x*z"
      component: y
    - node set: nsall
      function: "0.0"
      component: z
