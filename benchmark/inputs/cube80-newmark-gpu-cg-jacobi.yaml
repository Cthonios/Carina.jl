# cube80-newmark-gpu-cg-jacobi — generated by benchmark/write_inputs.jl from benchmark/cases.jl.
# Regenerate after editing cases.jl; do not edit this file by hand.
type: single
device: rocm
input mesh file: ../meshes/cube80.g
output mesh file: cube80-newmark-gpu-cg-jacobi.e
model:
  type: solid mechanics
  material:
    blocks:
      cube: neohookean
    neohookean:
      elastic modulus: 1.0e9
      density: 1000.0
      Poisson's ratio: 0.25
time integrator:
  type: newmark
  time step: 5.0e-5
  gamma: 0.5
  final time: 1.0e-4
  initial time: 0.0
  beta: 0.25
boundary conditions:
  dirichlet:
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
    - node set: nsz-
      component: z
      function: "0.0"
    - node set: nsz+
      component: z
      function: "1.0e-3 * t"
solver:
  type: newton
  termination:
    fail when any:
      - maximum iterations: 30
    converge when any:
      - absolute residual: 1.0e-6
      - relative residual: 1.0e-10
  linear solver:
    type: iterative
    tolerance: 1.0e-8
    maximum iterations: 1000
    preconditioner:
      type: jacobi
