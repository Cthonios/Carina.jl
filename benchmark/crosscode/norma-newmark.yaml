# Norma.jl — torsion, implicit dynamics (Newmark), 530k DOF.
#
# Cross-code counterpart of Carina's `torsion-newmark-*` decks and LCM's
# `lcm-newmark.yaml`.  Every physical and algorithmic setting below is matched
# to those two: same mesh file, neo-Hookean E = 1 GPa / nu = 0.25 / rho = 1000,
# free-free with a rigid-torsion initial velocity (a = 8000 1/s), Newmark
# beta = 0.25 / gamma = 0.5, dt = 5e-5 over 4 steps, Newton to abs 1e-6 or
# rel 1e-10.
#
# Derived from examples/ahead/single/torsion/dynamic/torsion.yaml in Norma,
# which is the same problem at 160 elements; only the mesh and the time step
# differ here.  The two meshes come from the same torsion.jou journal file, so
# block and node-set names match and the file is interchangeable.
type: single
input mesh file: torsion.g
output mesh file: norma-newmark.e
Exodus output interval: 0
CSV output interval: 0
model:
  type: solid mechanics
  material:
    blocks:
      torsion: hyperelastic
    hyperelastic:
      model: neohookean
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.25
      density: 1000.0
time integrator:
  type: Newmark
  β: 0.25
  γ: 0.5
  initial time: 0.0
  final time: 2.0e-04
  time step: 5.0e-05
initial conditions:
  displacement:
    - node set: nsall
      component: x
      function: "0.0"
    - node set: nsall
      component: y
      function: "0.0"
    - node set: nsall
      component: z
      function: "0.0"
  velocity:
    - node set: nsall
      component: x
      function: "a=8000; -a*y*z"
    - node set: nsall
      component: y
      function: "a=8000; a*x*z"
    - node set: nsall
      component: z
      function: "0.0"
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 128
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
