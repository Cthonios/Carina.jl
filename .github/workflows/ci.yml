name: CI

on:
  # Coverage on `main` is the baseline every pull request is compared against,
  # so the suite has to run on merges too -- not just on the pull requests
  # themselves. Documentation-only pushes cannot change coverage, so skip them.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/documentation.yml'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # midnight UTC daily
  workflow_dispatch:  # manual trigger

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.12']
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # Clone sibling dependencies (Project.toml uses relative paths)
      - name: Clone dependencies
        run: |
          cd ..
          git clone --depth 1 https://github.com/Cthonios/ConstitutiveModels.jl.git
          git clone --depth 1 https://github.com/Cthonios/FiniteElementContainers.jl.git
          git clone --depth 1 https://github.com/Cthonios/ReferenceFiniteElements.jl.git
          cd Carina.jl

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      - name: Install dependencies
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.update()
            Pkg.instantiate()
            Pkg.precompile()
          '

      # `@src` restricts instrumentation to this repository's sources. Plain
      # `user` coverage would also instrument the sibling path dependencies
      # cloned above, slowing the run and littering their trees with .cov files
      # that nothing consumes.
      - name: Run tests
        run: julia --color=no --project=. --code-coverage=@src test/runtests.jl

      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
