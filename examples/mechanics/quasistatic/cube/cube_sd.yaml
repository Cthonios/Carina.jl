type: single
input mesh file: cube.g
output mesh file: cube_sd.e
model:
  type: solid mechanics
  material:
    linear elastic:
      elastic modulus: 1.0e10
      density: 1000.0
      Poisson's ratio: 0.25
    blocks:
      cube: linear elastic
time integrator:
  type: quasi static
  time step: 0.1
  final time: 1.0
  initial time: 0.0
boundary conditions:
  dirichlet:
    - function: "0.0"
      side set: ssx-
      component: x
    - function: "0.0"
      side set: ssy-
      component: y
    - function: "0.0"
      side set: ssz-
      component: z
    - function: "1.0e-3 * t"
      side set: ssz+
      component: z
solver:
  type: steepest descent
  preconditioner:
    type: jacobi
  line search maximum iterations: 30
  # Steepest descent takes its step from an Armijo backtracking line search on
  # the total potential energy.  Near the solution the energy decrease falls
  # below the round-off of the energy itself, the Armijo test can no longer be
  # satisfied, and alpha collapses without the iterate moving -- this problem
  # stalls at a relative residual of ~1e-8.  Ask for a tolerance comfortably
  # above that floor; a tighter one cannot be reached by this method here.
  termination:
    fail when any:
      - maximum iterations: 1000
    converge when any:
      - relative residual: 1.0e-6
